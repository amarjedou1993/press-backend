# ═══════════════════════════════════════════════════════════════
#  Les messages envoyés aux candidats et à l'administration.
#
#  ⚠️ CE FICHIER EST FAIT POUR ÊTRE RELU PAR QUELQU'UN QUI N'EST PAS
#  DÉVELOPPEUR. Une phrase se corrige ici, sans recompiler.
#
#  Les {accolades} sont remplacées à l'envoi. Ne les traduisez pas et
#  n'en inventez pas : un nom inconnu reste affiché tel quel dans le
#  message.
#
#  Une ligne vide (\n\n) sépare deux paragraphes.
# ═══════════════════════════════════════════════════════════════

common.ministry=Ministère de la Culture, des Arts, de la Communication et des Relations avec le Parlement
common.signature=Ministère de la Culture, des Arts, de la Communication et des Relations avec le Parlement\nRépublique Islamique de Mauritanie
common.languageNote=Vous recevez ce message en français. Vous pouvez changer de langue depuis votre espace candidat.

# ── libellés résolus depuis un code ──
code.VALID=valide
code.SUSPENDED=suspendue
code.REVOKED=retirée
code.EXPIRED=expirée

code.PIECE_OVERLOOKED=Une pièce fournie n'a pas été prise en compte
code.FACTUAL_ERROR=La décision repose sur une appréciation erronée de mon activité
code.WRONG_CATEGORY=La décision applique une catégorie qui n'est pas la mienne
code.INSUFFICIENT_GROUNDS=Le motif communiqué ne permet pas de comprendre le refus
code.NEW_EVIDENCE=Je peux désormais produire une pièce qui faisait défaut
code.PROCEDURAL=La procédure n'a pas été respectée
code.OTHER=Autre motif

# ═══ compte ═══

VERIFY_EMAIL.subject=Vérifiez votre adresse e-mail
VERIFY_EMAIL.action=Confirmer mon adresse
VERIFY_EMAIL.body=Bonjour {fullName},\n\n\
Votre compte a bien été créé sur la plateforme d'accréditation presse du Ministère.\n\n\
Pour pouvoir déposer une demande de carte de presse, confirmez votre adresse e-mail. Ce lien est valable {hours} heures.\n\n\
Vous pouvez dès à présent vous connecter et compléter votre profil : seule la soumission d'un dossier nécessite cette vérification.\n\n\
Si vous n'êtes pas à l'origine de cette inscription, ignorez ce message.

PASSWORD_RESET.subject=Réinitialisation de votre mot de passe
PASSWORD_RESET.action=Choisir un nouveau mot de passe
PASSWORD_RESET.body=Bonjour {fullName},\n\n\
Une réinitialisation de mot de passe a été demandée pour votre compte.\n\n\
Ce lien est valable {minutes} minutes et ne peut être utilisé qu'une seule fois.\n\n\
Si vous n'avez pas fait cette demande, aucune action n'est nécessaire : votre mot de passe actuel reste valable.

EMAIL_CHANGE.subject=Confirmez votre nouvelle adresse e-mail
EMAIL_CHANGE.action=Confirmer cette adresse
EMAIL_CHANGE.body=Bonjour {fullName},\n\n\
Vous avez demandé à utiliser cette adresse pour votre compte d'accréditation presse.\n\n\
Ce lien est valable {hours} heures.\n\n\
Tant que la confirmation n'a pas eu lieu, votre ancienne adresse reste active.

EMAIL_CHANGE_NOTICE.subject=Demande de changement d'adresse e-mail
EMAIL_CHANGE_NOTICE.body=Bonjour {fullName},\n\n\
Une demande de changement d'adresse e-mail a été enregistrée sur votre compte, vers : {newEmail}\n\n\
Si vous êtes à l'origine de cette demande, aucune action n'est nécessaire : confirmez-la depuis la nouvelle adresse.\n\n\
SI CE N'EST PAS VOUS, changez immédiatement votre mot de passe et contactez le Ministère.

# ═══ dossier ═══

APPLICATION_SUBMITTED.subject=Votre dossier a bien été reçu
APPLICATION_SUBMITTED.action=Suivre mon dossier
APPLICATION_SUBMITTED.body=Bonjour {fullName},\n\n\
Votre demande de carte de presse (dossier n° {applicationId}) a été reçue et transmise à la commission d'examen.\n\n\
Vous serez informé par e-mail de toute évolution : demande de correction, décision, ou édition de votre carte.

CORRECTION_REQUESTED.subject=Des corrections sont demandées sur votre dossier
CORRECTION_REQUESTED.action=Corriger mon dossier
CORRECTION_REQUESTED.body=Bonjour {fullName},\n\n\
La commission d'examen a examiné votre dossier n° {applicationId} et demande des corrections avant de pouvoir se prononcer.\n\n\
Ce qui doit être corrigé :\n{message}\n\n\
Le détail pièce par pièce figure dans votre espace candidat : les documents concernés y sont signalés, avec l'observation de la commission.\n\n\
IMPORTANT : les corrections doivent être déposées avant la fin de la phase de correction. Passé ce délai, et sans réponse de votre part, le dossier sera rejeté.

CORRECTION_DEADLINE_WARNING.subject=Vos corrections sont attendues sous {days} jours
CORRECTION_DEADLINE_WARNING.action=Déposer mes corrections
CORRECTION_DEADLINE_WARNING.body=Bonjour {fullName},\n\n\
La commission d'examen a demandé des corrections sur votre dossier n° {applicationId}. À ce jour, elles n'ont pas été déposées.\n\n\
DATE LIMITE : {deadline}\n\n\
Passé ce délai, votre dossier sera rejeté pour dossier incomplet, sans nouvel examen. Vous conserverez alors votre droit de réclamation.

CORRECTION_RESUBMITTED.subject=Vos corrections ont bien été reçues
CORRECTION_RESUBMITTED.action=Suivre mon dossier
CORRECTION_RESUBMITTED.body=Bonjour {fullName},\n\n\
Les corrections demandées sur votre dossier n° {applicationId} ont été reçues. Votre dossier retourne devant la commission pour examen final.\n\n\
Vous serez informé par e-mail de la décision.

APPLICATION_ACCEPTED.subject=Votre demande de carte de presse a été acceptée
APPLICATION_ACCEPTED.action=Suivre mon dossier
APPLICATION_ACCEPTED.body=Bonjour {fullName},\n\n\
La commission d'examen a accepté votre demande de carte de presse (dossier n° {applicationId}).\n\n\
{message}\n\n\
Votre carte sera éditée par le Ministère et vous serez informé dès qu'elle sera disponible. Aucune démarche de votre part n'est nécessaire.

APPLICATION_REJECTED.subject=Décision concernant votre demande de carte de presse
APPLICATION_REJECTED.action=Consulter la décision
APPLICATION_REJECTED.body=Bonjour {fullName},\n\n\
Après examen, la commission n'a pas pu donner une suite favorable à votre demande de carte de presse (dossier n° {applicationId}).\n\n\
Motif de la décision :\n{message}\n\n\
VOUS POUVEZ CONTESTER CETTE DÉCISION. Une réclamation peut être déposée depuis votre espace candidat pendant la phase de réclamation de la session. Elle sera examinée par un membre de la commission différent de celui qui a rendu la présente décision.

OBJECTION_RECEIVED.subject=Votre réclamation a bien été enregistrée
OBJECTION_RECEIVED.action=Suivre mon dossier
OBJECTION_RECEIVED.body=Bonjour {fullName},\n\n\
Votre réclamation concernant le dossier n° {applicationId} a été enregistrée.\n\n\
Motif invoqué : {reasonCode}\n\n\
Elle sera examinée par un membre de la commission DIFFÉRENT de celui ayant rendu la décision contestée. Vous serez informé par e-mail de la décision définitive.

CARD_ISSUED.subject=Votre carte de presse a été éditée
CARD_ISSUED.action=Consulter mon dossier
CARD_ISSUED.body=Bonjour {fullName},\n\n\
Votre carte de presse a été établie par le Ministère.\n\n\
Numéro de carte : {cardNumber}\nValable jusqu'au : {expiresAt}\n\n\
Votre carte porte un code permettant à toute personne de vérifier sa validité auprès du Ministère.\n\n\
Les modalités de retrait vous seront communiquées prochainement.

# ═══ la carte en circulation ═══

CARD_SUSPENDED.subject=Votre carte de presse est suspendue
CARD_SUSPENDED.body=Bonjour {fullName},\n\n\
Votre carte de presse n° {cardNumber} est SUSPENDUE à compter de ce jour. Elle apparaîtra comme telle à toute vérification.\n\n\
Motif :\n{reason}\n\n\
Une suspension est une mesure conservatoire et réversible. Pour toute contestation, adressez-vous au Ministère.

CARD_REVOKED.subject=Retrait de votre carte de presse
CARD_REVOKED.body=Bonjour {fullName},\n\n\
Votre carte de presse n° {cardNumber} a été RETIRÉE. Elle n'est plus valable et apparaîtra comme retirée à toute vérification.\n\n\
{reason}\n\n\
Cette décision met fin à votre accréditation. Vous pourrez déposer une nouvelle candidature lors d'une prochaine session.

CARD_REINSTATED.subject=Votre carte de presse est rétablie
CARD_REINSTATED.body=Bonjour {fullName},\n\n\
Votre carte de presse n° {cardNumber} est de nouveau VALIDE.\n\n\
{reason}

# ═══ administration ═══

REVOCATION_PROPOSED.subject=Proposition de retrait de carte n° {proposalId}
REVOCATION_PROPOSED.action=Examiner la proposition
REVOCATION_PROPOSED.body=Une proposition de retrait a été déposée par un membre de la commission d'examen.\n\n\
Carte : {cardNumber}\nMotif invoqué : {groundCode}\n\n\
Le retrait d'une carte exige la décision du Ministère.
