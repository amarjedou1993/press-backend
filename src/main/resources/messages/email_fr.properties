# ═══════════════════════════════════════════════════════════════
#  Messages adressés aux candidats et à l'administration.
#
#  ⚠️ Ce fichier est destiné à être relu par une personne non
#  développeuse. Toute correction rédactionnelle doit être effectuée
#  directement ici, sans modification du code.
#
#  ⚠️ Le français constitue le texte de référence. La version arabe
#  doit en restituer fidèlement le sens.
#
#  Les {accolades} sont remplacées automatiquement lors de l'envoi.
#  Ne pas les traduire, les modifier ni en créer de nouvelles.
# ═══════════════════════════════════════════════════════════════

common.ministry=Ministère de la Culture, des Arts, de la Communication et des Relations avec le Parlement
common.signature=Ministère de la Culture, des Arts, de la Communication et des Relations avec le Parlement\nRépublique Islamique de Mauritanie
common.languageNote=Vous recevez ce message en français. Vous pouvez modifier votre langue de communication depuis votre espace candidat.

# ── Libellés correspondant aux codes ──
code.VALID=valide
code.SUSPENDED=suspendue
code.REVOKED=retirée
code.EXPIRED=expirée

code.PIECE_OVERLOOKED=Une pièce versée au dossier n'a pas été prise en compte
code.FACTUAL_ERROR=La décision repose sur une appréciation erronée de mon activité
code.WRONG_CATEGORY=La décision retient une catégorie qui ne correspond pas à ma situation
code.INSUFFICIENT_GROUNDS=Le motif communiqué ne permet pas de comprendre les fondements du refus
code.NEW_EVIDENCE=Je suis désormais en mesure de produire une pièce qui faisait défaut
code.PROCEDURAL=La procédure applicable n'a pas été respectée
code.OTHER=Autre motif

# ═══ COMPTE ═══

VERIFY_EMAIL.subject=Confirmation de votre adresse électronique
VERIFY_EMAIL.action=Confirmer mon adresse
VERIFY_EMAIL.body=Bonjour {fullName},\n\n\
Votre compte a été créé sur la plateforme d'accréditation presse du Ministère.\n\n\
Afin de pouvoir déposer une demande de carte de presse, veuillez confirmer votre adresse électronique. Le présent lien est valable pendant {hours} heures.\n\n\
Vous pouvez dès à présent vous connecter et compléter votre profil. La confirmation de votre adresse électronique est uniquement requise pour le dépôt de votre dossier.\n\n\
Si vous n'êtes pas à l'origine de cette inscription, veuillez ne pas tenir compte de ce message.

PASSWORD_RESET.subject=Réinitialisation de votre mot de passe
PASSWORD_RESET.action=Choisir un nouveau mot de passe
PASSWORD_RESET.body=Bonjour {fullName},\n\n\
Une demande de réinitialisation du mot de passe de votre compte a été enregistrée.\n\n\
Le présent lien est valable pendant {minutes} minutes et ne peut être utilisé qu'une seule fois.\n\n\
Si vous n'êtes pas à l'origine de cette demande, aucune démarche n'est requise. Votre mot de passe actuel demeure valable.

EMAIL_CHANGE.subject=Confirmation de votre nouvelle adresse électronique
EMAIL_CHANGE.action=Confirmer cette adresse
EMAIL_CHANGE.body=Bonjour {fullName},\n\n\
Vous avez demandé à utiliser cette adresse électronique pour votre compte d'accréditation presse.\n\n\
Le présent lien est valable pendant {hours} heures.\n\n\
Tant que cette nouvelle adresse n'a pas été confirmée, votre adresse électronique précédente demeure active.

EMAIL_CHANGE_NOTICE.subject=Demande de modification de votre adresse électronique
EMAIL_CHANGE_NOTICE.body=Bonjour {fullName},\n\n\
Une demande de modification de l'adresse électronique associée à votre compte a été enregistrée au profit de l'adresse suivante : {newEmail}\n\n\
Si vous êtes à l'origine de cette demande, aucune autre démarche n'est requise sur votre adresse actuelle. Veuillez confirmer la modification depuis la nouvelle adresse électronique.\n\n\
Si vous n'êtes pas à l'origine de cette demande, veuillez modifier immédiatement votre mot de passe et prendre contact avec le Ministère.

# ═══ DOSSIER ═══

APPLICATION_SUBMITTED.subject=Accusé de réception de votre dossier
APPLICATION_SUBMITTED.action=Suivre mon dossier
APPLICATION_SUBMITTED.body=Bonjour {fullName},\n\n\
Votre demande de carte de presse, enregistrée sous le numéro {applicationId}, a bien été reçue et transmise à la commission d'examen.\n\n\
Vous serez informé par courrier électronique de toute évolution concernant votre dossier, notamment de toute demande de correction, décision ou édition de votre carte.

CORRECTION_REQUESTED.subject=Corrections à apporter à votre dossier
CORRECTION_REQUESTED.action=Corriger mon dossier
CORRECTION_REQUESTED.body=Bonjour {fullName},\n\n\
Après examen de votre dossier n° {applicationId}, la commission vous demande d'y apporter certaines corrections avant de pouvoir se prononcer.\n\n\
Corrections demandées :\n{message}\n\n\
Le détail des corrections à apporter figure dans votre espace candidat. Les pièces concernées y sont identifiées et accompagnées, le cas échéant, des observations de la commission.\n\n\
Les corrections doivent impérativement être déposées avant l'expiration de la phase prévue à cet effet. À défaut de réponse dans le délai imparti, votre dossier sera rejeté.

CORRECTION_DEADLINE_WARNING.subject=Rappel — corrections attendues sous {days} jours
CORRECTION_DEADLINE_WARNING.action=Déposer mes corrections
CORRECTION_DEADLINE_WARNING.body=Bonjour {fullName},\n\n\
La commission d'examen vous a demandé d'apporter des corrections à votre dossier n° {applicationId}. À ce jour, celles-ci n'ont pas encore été déposées.\n\n\
Date limite de dépôt : {deadline}\n\n\
À l'expiration de ce délai, votre dossier sera rejeté pour cause d'incomplétude, sans nouvel examen. Vous conserverez toutefois la possibilité d'exercer votre droit de réclamation.

CORRECTION_RESUBMITTED.subject=Accusé de réception de vos corrections
CORRECTION_RESUBMITTED.action=Suivre mon dossier
CORRECTION_RESUBMITTED.body=Bonjour {fullName},\n\n\
Les corrections demandées concernant votre dossier n° {applicationId} ont bien été reçues.\n\n\
Votre dossier est de nouveau transmis à la commission en vue de son examen final.\n\n\
Vous serez informé par courrier électronique de la décision prise.

APPLICATION_ACCEPTED.subject=Acceptation de votre demande de carte de presse
APPLICATION_ACCEPTED.action=Suivre mon dossier
APPLICATION_ACCEPTED.body=Bonjour {fullName},\n\n\
La commission d'examen a accepté votre demande de carte de presse, enregistrée sous le numéro {applicationId}.\n\n\
{message}\n\n\
Votre carte sera établie par le Ministère. Vous serez informé dès qu'elle sera disponible. Aucune démarche supplémentaire n'est requise de votre part à ce stade.

APPLICATION_REJECTED.subject=Décision relative à votre demande de carte de presse
APPLICATION_REJECTED.action=Consulter la décision
APPLICATION_REJECTED.body=Bonjour {fullName},\n\n\
Après examen de votre dossier, la commission a décidé de ne pas donner une suite favorable à votre demande de carte de presse, enregistrée sous le numéro {applicationId}.\n\n\
Motif de la décision :\n{message}\n\n\
Vous pouvez former une réclamation contre cette décision. La réclamation doit être déposée depuis votre espace candidat pendant la phase de réclamation prévue pour la session concernée. Elle sera examinée par un membre de la commission distinct de celui ayant rendu la décision contestée.

OBJECTION_RECEIVED.subject=Accusé de réception de votre réclamation
OBJECTION_RECEIVED.action=Suivre mon dossier
OBJECTION_RECEIVED.body=Bonjour {fullName},\n\n\
Votre réclamation relative au dossier n° {applicationId} a bien été enregistrée.\n\n\
Motif invoqué : {reasonCode}\n\n\
Votre réclamation sera examinée par un membre de la commission distinct de celui ayant rendu la décision contestée. Vous serez informé par courrier électronique de la décision définitive.

CARD_ISSUED.subject=Établissement de votre carte de presse
CARD_ISSUED.action=Consulter mon dossier
CARD_ISSUED.body=Bonjour {fullName},\n\n\
Votre carte de presse a été établie par le Ministère.\n\n\
Numéro de la carte : {cardNumber}\nValable jusqu'au : {expiresAt}\n\n\
Votre carte comporte un code permettant à toute personne d'en vérifier la validité auprès du Ministère.\n\n\
Les modalités de retrait de votre carte vous seront communiquées prochainement.

# ═══ RENOUVELLEMENT ═══

RENEWAL_INVITATION.subject=Renouvellement de votre carte de presse
RENEWAL_INVITATION.action=Renouveler ma carte
RENEWAL_INVITATION.body=Bonjour {fullName},\n\n\
Le Ministère a ouvert une session de renouvellement des cartes de presse.\n\n\
Votre carte n° {cardNumber} arrive à échéance le {cardExpiry}.\n\n\
Date limite de dépôt : {deadline}\n\n\
La demande de renouvellement doit être déposée depuis votre espace candidat. Votre identité ayant déjà été vérifiée, seules les pièces relatives à votre activité professionnelle actuelle sont requises, notamment votre contrat de travail, vos travaux publiés récemment et les informations relatives à votre organe de presse. Une photographie récente doit également être fournie.\n\n\
À l'expiration de ce délai, votre carte cessera d'être valable. Le renouvellement restera possible pendant une période d'un an. Durant cette période, votre carte demeurera toutefois invalide et apparaîtra comme expirée lors de toute vérification. Au-delà d'un an, le dépôt d'une nouvelle candidature complète sera requis.

CARD_RENEWED.subject=Renouvellement de votre carte de presse
CARD_RENEWED.action=Consulter mon dossier
CARD_RENEWED.body=Bonjour {fullName},\n\n\
Votre carte de presse a été renouvelée par le Ministère.\n\n\
Nouveau numéro de carte : {cardNumber}\nValable jusqu'au : {expiresAt}\n\n\
Votre précédente carte, n° {previousCardNumber}, n'est désormais plus valable et apparaîtra comme retirée lors de toute vérification. Vous pouvez la détruire ou la restituer au Ministère à votre convenance. Aucune démarche n'est exigée de votre part à ce titre.\n\n\
Votre nouvelle carte comporte un code permettant à toute personne d'en vérifier la validité auprès du Ministère.\n\n\
Les modalités de retrait de votre nouvelle carte vous seront communiquées prochainement.

INSTITUTIONAL_RENEWAL_DUE.subject=Prochaine échéance de vos cartes de presse
INSTITUTIONAL_RENEWAL_DUE.body=\
Des cartes de presse délivrées à vos journalistes, au nombre de {cardCount}, arrivent prochainement à échéance, la première le {earliestExpiry}.\n\n\
Pour procéder à leur renouvellement, veuillez déposer à nouveau votre registre depuis votre espace. Les journalistes qui y seront maintenus pourront bénéficier du renouvellement ; ceux qui en auront été retirés ne seront pas renouvelés. Le Ministère procédera ensuite à l'octroi des cartes correspondantes.\n\n\
Toute carte non renouvelée cesse d'être valable à sa date d'échéance et apparaîtra comme expirée lors de toute vérification.
INSTITUTIONAL_RENEWAL_DUE.action=Accéder à mon espace

PRINT_DIGEST.subject={total} carte(s) prête(s) pour production
PRINT_DIGEST.body=\
{total} carte(s) sont actuellement en attente de production :\n\n\
— cartes de session : {sessionCards}\n\
— cartes d'honneur : {honourCards}\n\
— cartes institutionnelles : {institutionalCards}\n\n\
Les éléments nécessaires à la production des cartes — photographie et code de vérification — peuvent être téléchargés depuis votre espace.

INSTITUTION_REQUEST_CONFIRM.subject=Confirmation de l'adresse électronique associée à votre demande
INSTITUTION_REQUEST_CONFIRM.body=\
Bonjour {contactName},\n\n\
Votre demande d'enregistrement de {institutionName} en tant qu'institution a bien été reçue.\n\n\
Veuillez confirmer cette adresse électronique afin que votre demande puisse être transmise au Ministère. Elle ne pourra être examinée qu'après cette confirmation.\n\n\
Le présent lien est valable pendant {days} jours.
INSTITUTION_REQUEST_CONFIRM.action=Confirmer mon adresse

INSTITUTION_REQUEST_APPROVED.subject=Approbation de l'enregistrement de votre institution
INSTITUTION_REQUEST_APPROVED.body=\
Bonjour {contactName},\n\n\
Le Ministère a approuvé la demande d'enregistrement de {institutionName}.\n\n\
Votre compte est désormais actif. Vous pouvez vous connecter à l'aide de l'adresse électronique et du mot de passe choisis lors du dépôt de votre demande, puis enregistrer vos journalistes depuis votre espace.
INSTITUTION_REQUEST_APPROVED.action=Se connecter

INSTITUTION_REQUEST_REJECTED.subject=Décision relative à votre demande d'enregistrement
INSTITUTION_REQUEST_REJECTED.body=\
Bonjour {contactName},\n\n\
Après examen, le Ministère n'a pas donné une suite favorable à la demande d'enregistrement de {institutionName}, pour le motif suivant :\n\n\
{reason}\n\n\
Vous avez la possibilité de présenter une nouvelle demande accompagnée des éléments requis.

# ═══ CARTE EN CIRCULATION ═══

CARD_SUSPENDED.subject=Suspension de votre carte de presse
CARD_SUSPENDED.body=Bonjour {fullName},\n\n\
Votre carte de presse n° {cardNumber} fait l'objet d'une suspension à compter de ce jour. Elle apparaîtra comme suspendue lors de toute vérification.\n\n\
Motif de la suspension :\n{reason}\n\n\
La suspension constitue une mesure conservatoire et réversible. Pour toute contestation relative à cette mesure, veuillez vous adresser au Ministère.

CARD_REVOKED.subject=Retrait de votre carte de presse
CARD_REVOKED.body=Bonjour {fullName},\n\n\
Votre carte de presse n° {cardNumber} a fait l'objet d'un retrait. Elle n'est désormais plus valable et apparaîtra comme retirée lors de toute vérification.\n\n\
Motif du retrait :\n{reason}\n\n\
Cette décision met fin à votre accréditation. Vous pourrez présenter une nouvelle candidature lors d'une prochaine session.

CARD_REINSTATED.subject=Rétablissement de la validité de votre carte de presse
CARD_REINSTATED.body=Bonjour {fullName},\n\n\
Votre carte de presse n° {cardNumber} est de nouveau valide.\n\n\
{reason}

# ═══ ADMINISTRATION ═══

REVOCATION_PROPOSED.subject=Proposition de retrait de la carte n° {proposalId}
REVOCATION_PROPOSED.action=Examiner la proposition
REVOCATION_PROPOSED.body=Un membre de la commission d'examen a soumis une proposition de retrait d'une carte de presse.\n\n\
Carte concernée : {cardNumber}\nMotif invoqué : {groundCode}\n\n\
Le retrait d'une carte est subordonné à une décision du Ministère.
