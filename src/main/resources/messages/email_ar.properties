# ═══════════════════════════════════════════════════════════════
#  الرسائل الموجهة إلى المترشحين والإدارة.
#
#  ⚠️ هذا الملف معد ليراجعه شخص غير مبرمج. تُصحح الجملة هنا، دون
#  إعادة ترجمة الشيفرة.
#
#  ⚠️ RELECTURE NATIVE REQUISE. Ces phrases sont une première
#  rédaction. Le français est le texte de référence ; l'arabe doit
#  dire la MÊME chose. Trois messages énoncent des actes
#  administratifs — refus, retrait, réclamation — et méritent une
#  relecture juridique, pas seulement linguistique.
#
#  Les {accolades} sont remplacées à l'envoi. Ne les traduisez pas.
# ═══════════════════════════════════════════════════════════════

common.ministry=وزارة الثقافة والفنون والاتصال والعلاقات مع البرلمان
common.signature=وزارة الثقافة والفنون والاتصال والعلاقات مع البرلمان\nالجمهورية الإسلامية الموريتانية
common.languageNote=تصلك هذه الرسالة بالعربية. يمكنك تغيير اللغة من فضاء المترشح الخاص بك.

# ── التسميات المستخرجة من رمز ──
code.VALID=سارية
code.SUSPENDED=موقوفة
code.REVOKED=مسحوبة
code.EXPIRED=منتهية الصلاحية

code.PIECE_OVERLOOKED=لم تؤخذ إحدى الوثائق المقدمة بعين الاعتبار
code.FACTUAL_ERROR=يستند القرار إلى تقدير خاطئ لنشاطي
code.WRONG_CATEGORY=يطبق القرار فئة لا تنطبق عليّ
code.INSUFFICIENT_GROUNDS=المبرر المبلَّغ لا يسمح بفهم الرفض
code.NEW_EVIDENCE=يمكنني الآن تقديم وثيقة كانت ناقصة
code.PROCEDURAL=لم تُحترم الإجراءات
code.OTHER=مبرر آخر

# ═══ الحساب ═══

VERIFY_EMAIL.subject=تحقق من بريدك الإلكتروني
VERIFY_EMAIL.action=تأكيد بريدي
VERIFY_EMAIL.body=السلام عليكم {fullName}،\n\n\
تم إنشاء حسابك على منصة الاعتماد الصحفي التابعة للوزارة.\n\n\
لتتمكن من إيداع طلب البطاقة الصحفية، أكد بريدك الإلكتروني. هذا الرابط صالح لمدة {hours} ساعة.\n\n\
يمكنك من الآن تسجيل الدخول وإكمال ملفك الشخصي: التحقق مطلوب فقط لإيداع الملف.\n\n\
إذا لم تكن أنت من قام بهذا التسجيل، تجاهل هذه الرسالة.

PASSWORD_RESET.subject=إعادة تعيين كلمة السر
PASSWORD_RESET.action=اختيار كلمة سر جديدة
PASSWORD_RESET.body=السلام عليكم {fullName}،\n\n\
طُلبت إعادة تعيين كلمة السر لحسابك.\n\n\
هذا الرابط صالح لمدة {minutes} دقيقة ولا يمكن استعماله إلا مرة واحدة.\n\n\
إذا لم تقدم هذا الطلب، فلا داعي لأي إجراء: كلمة سرك الحالية تبقى صالحة.

EMAIL_CHANGE.subject=أكد بريدك الإلكتروني الجديد
EMAIL_CHANGE.action=تأكيد هذا البريد
EMAIL_CHANGE.body=السلام عليكم {fullName}،\n\n\
طلبت استعمال هذا البريد لحسابك في الاعتماد الصحفي.\n\n\
هذا الرابط صالح لمدة {hours} ساعة.\n\n\
وما لم يتم التأكيد، يبقى بريدك السابق نشطًا.

EMAIL_CHANGE_NOTICE.subject=طلب تغيير البريد الإلكتروني
EMAIL_CHANGE_NOTICE.body=السلام عليكم {fullName}،\n\n\
سُجّل طلب تغيير البريد الإلكتروني على حسابك، إلى: {newEmail}\n\n\
إذا كنت أنت صاحب الطلب، فلا داعي لأي إجراء: أكده من البريد الجديد.\n\n\
إذا لم تكن أنت، غيّر كلمة سرك فورًا واتصل بالوزارة.

# ═══ الملف ═══

APPLICATION_SUBMITTED.subject=تم استلام ملفك
APPLICATION_SUBMITTED.action=متابعة ملفي
APPLICATION_SUBMITTED.body=السلام عليكم {fullName}،\n\n\
تم استلام طلبك للبطاقة الصحفية (الملف رقم {applicationId}) وإحالته إلى لجنة الفحص.\n\n\
ستُعلَم بالبريد الإلكتروني بكل تطور: طلب تصحيح، أو قرار، أو إصدار بطاقتك.

CORRECTION_REQUESTED.subject=مطلوب تصحيحات على ملفك
CORRECTION_REQUESTED.action=تصحيح ملفي
CORRECTION_REQUESTED.body=السلام عليكم {fullName}،\n\n\
درست لجنة الفحص ملفك رقم {applicationId} وتطلب تصحيحات قبل أن تتمكن من البت فيه.\n\n\
ما يجب تصحيحه:\n{message}\n\n\
التفاصيل وثيقة وثيقة موجودة في فضاء المترشح: الوثائق المعنية مؤشر عليها، مع ملاحظة اللجنة.\n\n\
تنبيه: يجب إيداع التصحيحات قبل نهاية مرحلة التصحيح. وبانقضاء هذا الأجل دون رد منك، سيُرفض الملف.

CORRECTION_DEADLINE_WARNING.subject=تصحيحاتك منتظرة خلال {days} أيام
CORRECTION_DEADLINE_WARNING.action=إيداع تصحيحاتي
CORRECTION_DEADLINE_WARNING.body=السلام عليكم {fullName}،\n\n\
طلبت لجنة الفحص تصحيحات على ملفك رقم {applicationId}. وإلى اليوم لم تُودع.\n\n\
آخر أجل: {deadline}\n\n\
بانقضاء هذا الأجل، سيُرفض ملفك لعدم اكتماله، دون دراسة جديدة. وتحتفظ عندها بحقك في التظلم.

CORRECTION_RESUBMITTED.subject=تم استلام تصحيحاتك
CORRECTION_RESUBMITTED.action=متابعة ملفي
CORRECTION_RESUBMITTED.body=السلام عليكم {fullName}،\n\n\
تم استلام التصحيحات المطلوبة على ملفك رقم {applicationId}. ويعود ملفك إلى اللجنة للدراسة النهائية.\n\n\
ستُعلَم بالبريد الإلكتروني بالقرار.

APPLICATION_ACCEPTED.subject=تم قبول طلبك للبطاقة الصحفية
APPLICATION_ACCEPTED.action=متابعة ملفي
APPLICATION_ACCEPTED.body=السلام عليكم {fullName}،\n\n\
قبلت لجنة الفحص طلبك للحصول على البطاقة الصحفية (الملف رقم {applicationId}).\n\n\
{message}\n\n\
ستصدر الوزارة بطاقتك وستُعلَم فور جاهزيتها. ولا يتطلب الأمر أي إجراء من جانبك.

APPLICATION_REJECTED.subject=قرار بشأن طلبك للبطاقة الصحفية
APPLICATION_REJECTED.action=الاطلاع على القرار
APPLICATION_REJECTED.body=السلام عليكم {fullName}،\n\n\
بعد الدراسة، لم تتمكن اللجنة من الاستجابة لطلبك للحصول على البطاقة الصحفية (الملف رقم {applicationId}).\n\n\
مبرر القرار:\n{message}\n\n\
يمكنك الطعن في هذا القرار. يودَع التظلم من فضاء المترشح خلال مرحلة التظلم من الدورة، ويدرسه عضو من اللجنة غير العضو الذي أصدر هذا القرار.

OBJECTION_RECEIVED.subject=تم تسجيل تظلمك
OBJECTION_RECEIVED.action=متابعة ملفي
OBJECTION_RECEIVED.body=السلام عليكم {fullName}،\n\n\
سُجّل تظلمك بشأن الملف رقم {applicationId}.\n\n\
المبرر المحتج به: {reasonCode}\n\n\
سيدرسه عضو من اللجنة غير العضو الذي أصدر القرار المطعون فيه. وستُعلَم بالبريد الإلكتروني بالقرار النهائي.

CARD_ISSUED.subject=تم إصدار بطاقتك الصحفية
CARD_ISSUED.action=الاطلاع على ملفي
CARD_ISSUED.body=السلام عليكم {fullName}،\n\n\
أصدرت الوزارة بطاقتك الصحفية.\n\n\
رقم البطاقة: {cardNumber}\nسارية إلى غاية: {expiresAt}\n\n\
تحمل بطاقتك رمزًا يتيح لأي شخص التحقق من صلاحيتها لدى الوزارة.\n\n\
ستُبلَّغ قريبًا بكيفية الاستلام.

# ═══ البطاقة في التداول ═══

CARD_SUSPENDED.subject=بطاقتك الصحفية موقوفة
CARD_SUSPENDED.body=السلام عليكم {fullName}،\n\n\
بطاقتك الصحفية رقم {cardNumber} موقوفة ابتداء من اليوم. وستظهر كذلك في أي عملية تحقق.\n\n\
المبرر:\n{reason}\n\n\
الإيقاف إجراء تحفظي وقابل للرجوع. لأي طعن، اتصل بالوزارة.

CARD_REVOKED.subject=سحب بطاقتك الصحفية
CARD_REVOKED.body=السلام عليكم {fullName}،\n\n\
سُحبت بطاقتك الصحفية رقم {cardNumber}. ولم تعد صالحة وستظهر كمسحوبة في أي عملية تحقق.\n\n\
{reason}\n\n\
ينهي هذا القرار اعتمادك. ويمكنك تقديم ترشح جديد في دورة لاحقة.

CARD_REINSTATED.subject=تم رد الاعتبار لبطاقتك الصحفية
CARD_REINSTATED.body=السلام عليكم {fullName}،\n\n\
بطاقتك الصحفية رقم {cardNumber} أصبحت سارية من جديد.\n\n\
{reason}

# ═══ الإدارة ═══
# ⚠️ رسالة موجهة إلى الإدارة، وهي تُرسل بالفرنسية دائمًا. هذه النسخة
#    موجودة للاكتمال فقط.

REVOCATION_PROPOSED.subject=اقتراح سحب البطاقة رقم {proposalId}
REVOCATION_PROPOSED.action=دراسة الاقتراح
REVOCATION_PROPOSED.body=أودع أحد أعضاء لجنة الفحص اقتراحًا بسحب بطاقة.\n\n\
البطاقة: {cardNumber}\nالمبرر المحتج به: {groundCode}\n\n\
يتطلب سحب البطاقة قرارًا من الوزارة.
