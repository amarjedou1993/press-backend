# ═══════════════════════════════════════════════════════════════
#  الرسائل الموجهة إلى المترشحين والإدارة.
#
#  ⚠️ هذا الملف مخصص للمراجعة من طرف شخص غير مبرمج. ويجب إجراء
#  أي تصحيح لغوي أو تحريري مباشرة هنا دون تعديل الشيفرة.
#
#  ⚠️ النص الفرنسي هو النص المرجعي، ويجب أن تعكس النسخة العربية
#  مضمونه بدقة.
#
#  يتم استبدال العناصر الواردة بين {الأقواس} تلقائيًا عند الإرسال.
#  ويجب عدم ترجمتها أو تعديلها أو إنشاء عناصر جديدة منها.
# ═══════════════════════════════════════════════════════════════

common.ministry=وزارة الثقافة والفنون والاتصال والعلاقات مع البرلمان
common.signature=وزارة الثقافة والفنون والاتصال والعلاقات مع البرلمان\nالجمهورية الإسلامية الموريتانية
common.languageNote=تصلكم هذه الرسالة باللغة العربية. ويمكنكم تغيير لغة التواصل من خلال فضاء المترشح الخاص بكم.

# ── التسميات المقابلة للرموز ──
code.VALID=سارية
code.SUSPENDED=موقوفة
code.REVOKED=مسحوبة
code.EXPIRED=منتهية الصلاحية

code.PIECE_OVERLOOKED=لم تؤخذ إحدى الوثائق المودعة ضمن الملف بعين الاعتبار
code.FACTUAL_ERROR=يستند القرار إلى تقدير غير صحيح لنشاطي
code.WRONG_CATEGORY=اعتمد القرار فئة لا تتوافق مع وضعيتي
code.INSUFFICIENT_GROUNDS=لا يتيح المبرر المبلّغ فهم الأسس التي بُني عليها الرفض
code.NEW_EVIDENCE=أصبحت الآن قادرًا على تقديم وثيقة كانت ناقصة
code.PROCEDURAL=لم تُحترم الإجراءات الواجبة التطبيق
code.OTHER=مبرر آخر

# ═══ الحساب ═══

VERIFY_EMAIL.subject=تأكيد عنوان بريدكم الإلكتروني
VERIFY_EMAIL.action=تأكيد عنوان بريدي
VERIFY_EMAIL.body=السلام عليكم {fullName}،\n\n\
تم إنشاء حسابكم على منصة الاعتماد الصحفي التابعة للوزارة.\n\n\
حتى يتسنى لكم إيداع طلب الحصول على البطاقة الصحفية، يرجى تأكيد عنوان بريدكم الإلكتروني. يظل هذا الرابط صالحًا لمدة {hours} ساعة.\n\n\
يمكنكم من الآن تسجيل الدخول واستكمال ملفكم الشخصي. ولا يشترط تأكيد عنوان البريد الإلكتروني إلا عند إيداع ملف الترشح.\n\n\
إذا لم تكونوا أنتم من قام بهذا التسجيل، يرجى تجاهل هذه الرسالة.

PASSWORD_RESET.subject=إعادة تعيين كلمة المرور
PASSWORD_RESET.action=اختيار كلمة مرور جديدة
PASSWORD_RESET.body=السلام عليكم {fullName}،\n\n\
تم تسجيل طلب لإعادة تعيين كلمة المرور الخاصة بحسابكم.\n\n\
يظل هذا الرابط صالحًا لمدة {minutes} دقيقة، ولا يمكن استخدامه إلا مرة واحدة.\n\n\
إذا لم تكونوا أنتم من تقدم بهذا الطلب، فلا يلزم اتخاذ أي إجراء، وتظل كلمة المرور الحالية سارية.

EMAIL_CHANGE.subject=تأكيد عنوان بريدكم الإلكتروني الجديد
EMAIL_CHANGE.action=تأكيد هذا العنوان
EMAIL_CHANGE.body=السلام عليكم {fullName}،\n\n\
طلبتم اعتماد هذا العنوان الإلكتروني لحسابكم على منصة الاعتماد الصحفي.\n\n\
يظل هذا الرابط صالحًا لمدة {hours} ساعة.\n\n\
وإلى حين تأكيد العنوان الجديد، يظل عنوان بريدكم الإلكتروني السابق نشطًا.

EMAIL_CHANGE_NOTICE.subject=طلب تغيير عنوان البريد الإلكتروني
EMAIL_CHANGE_NOTICE.body=السلام عليكم {fullName}،\n\n\
تم تسجيل طلب لتغيير عنوان البريد الإلكتروني المرتبط بحسابكم إلى العنوان التالي: {newEmail}\n\n\
إذا كنتم أنتم من تقدم بهذا الطلب، فلا يلزم اتخاذ أي إجراء من خلال عنوانكم الحالي، ويرجى تأكيد التغيير انطلاقًا من عنوان البريد الإلكتروني الجديد.\n\n\
أما إذا لم تكونوا أنتم من تقدم بهذا الطلب، فيرجى تغيير كلمة المرور فورًا والاتصال بالوزارة.

# ═══ الملف ═══

APPLICATION_SUBMITTED.subject=إشعار باستلام ملفكم
APPLICATION_SUBMITTED.action=متابعة ملفي
APPLICATION_SUBMITTED.body=السلام عليكم {fullName}،\n\n\
تم استلام طلبكم للحصول على البطاقة الصحفية، المسجل تحت رقم {applicationId}، وإحالته إلى لجنة دراسة الملفات.\n\n\
وسيتم إشعاركم عبر البريد الإلكتروني بأي مستجد يتعلق بملفكم، بما في ذلك طلبات التصحيح أو القرار المتخذ بشأنه أو إصدار بطاقتكم.

CORRECTION_REQUESTED.subject=تصحيحات مطلوبة على ملفكم
CORRECTION_REQUESTED.action=تصحيح ملفي
CORRECTION_REQUESTED.body=السلام عليكم {fullName}،\n\n\
بعد دراسة ملفكم رقم {applicationId}، تطلب منكم اللجنة إدخال بعض التصحيحات عليه قبل أن تتمكن من البت فيه.\n\n\
التصحيحات المطلوبة:\n{message}\n\n\
تجدون في فضاء المترشح التفاصيل المتعلقة بالتصحيحات المطلوبة، حيث تم تحديد الوثائق المعنية وإرفاقها، عند الاقتضاء، بملاحظات اللجنة.\n\n\
يجب إيداع التصحيحات قبل انقضاء المرحلة المخصصة لذلك. وفي حال عدم الرد داخل الأجل المحدد، سيتم رفض ملفكم.

CORRECTION_DEADLINE_WARNING.subject=تذكير — التصحيحات مطلوبة خلال {days} أيام
CORRECTION_DEADLINE_WARNING.action=إيداع تصحيحاتي
CORRECTION_DEADLINE_WARNING.body=السلام عليكم {fullName}،\n\n\
سبق للجنة دراسة الملفات أن طلبت منكم إدخال تصحيحات على ملفكم رقم {applicationId}، ولم يتم إيداعها حتى تاريخه.\n\n\
آخر أجل للإيداع: {deadline}\n\n\
عند انقضاء هذا الأجل، سيتم رفض ملفكم لعدم اكتماله دون إعادة دراسته. ومع ذلك، يظل حقكم في تقديم تظلم قائمًا.

CORRECTION_RESUBMITTED.subject=إشعار باستلام تصحيحاتكم
CORRECTION_RESUBMITTED.action=متابعة ملفي
CORRECTION_RESUBMITTED.body=السلام عليكم {fullName}،\n\n\
تم استلام التصحيحات المطلوبة بشأن ملفكم رقم {applicationId}.\n\n\
وقد أُعيدت إحالة ملفكم إلى اللجنة من أجل الدراسة النهائية.\n\n\
وسيتم إشعاركم بالقرار عبر البريد الإلكتروني.

APPLICATION_ACCEPTED.subject=قبول طلبكم للحصول على البطاقة الصحفية
APPLICATION_ACCEPTED.action=متابعة ملفي
APPLICATION_ACCEPTED.body=السلام عليكم {fullName}،\n\n\
وافقت لجنة دراسة الملفات على طلبكم للحصول على البطاقة الصحفية، المسجل تحت رقم {applicationId}.\n\n\
{message}\n\n\
ستتولى الوزارة إعداد بطاقتكم، وسيتم إشعاركم فور جاهزيتها. ولا يلزم من جانبكم اتخاذ أي إجراء إضافي في هذه المرحلة.

APPLICATION_REJECTED.subject=قرار بشأن طلبكم للحصول على البطاقة الصحفية
APPLICATION_REJECTED.action=الاطلاع على القرار
APPLICATION_REJECTED.body=السلام عليكم {fullName}،\n\n\
بعد دراسة ملفكم، قررت اللجنة عدم الاستجابة لطلبكم للحصول على البطاقة الصحفية، المسجل تحت رقم {applicationId}.\n\n\
مبرر القرار:\n{message}\n\n\
يمكنكم تقديم تظلم من هذا القرار. ويجب إيداع التظلم من خلال فضاء المترشح خلال المرحلة المخصصة للتظلمات في الدورة المعنية. ويتولى دراسته عضو من أعضاء اللجنة غير العضو الذي أصدر القرار محل التظلم.

OBJECTION_RECEIVED.subject=إشعار باستلام تظلمكم
OBJECTION_RECEIVED.action=متابعة ملفي
OBJECTION_RECEIVED.body=السلام عليكم {fullName}،\n\n\
تم تسجيل تظلمكم المتعلق بالملف رقم {applicationId}.\n\n\
المبرر المستند إليه: {reasonCode}\n\n\
سيتولى دراسة تظلمكم عضو من أعضاء اللجنة غير العضو الذي أصدر القرار محل التظلم. وسيتم إشعاركم عبر البريد الإلكتروني بالقرار النهائي.

CARD_ISSUED.subject=إصدار بطاقتكم الصحفية
CARD_ISSUED.action=الاطلاع على ملفي
CARD_ISSUED.body=السلام عليكم {fullName}،\n\n\
تم إصدار بطاقتكم الصحفية من طرف الوزارة.\n\n\
رقم البطاقة: {cardNumber}\nصالحة إلى غاية: {expiresAt}\n\n\
تتضمن بطاقتكم رمز تحقق يتيح لأي شخص التحقق من صلاحيتها لدى الوزارة.\n\n\
وسيتم إبلاغكم قريبًا بإجراءات استلام البطاقة.

# ═══ التجديد ═══

RENEWAL_INVITATION.subject=تجديد بطاقتكم الصحفية
RENEWAL_INVITATION.action=تجديد بطاقتي
RENEWAL_INVITATION.body=السلام عليكم {fullName}،\n\n\
أعلنت الوزارة عن فتح دورة لتجديد البطاقات الصحفية.\n\n\
تنتهي صلاحية بطاقتكم رقم {cardNumber} بتاريخ {cardExpiry}.\n\n\
آخر أجل للإيداع: {deadline}\n\n\
يجب تقديم طلب التجديد من خلال فضاء المترشح. وبما أن هويتكم سبق التحقق منها، فلا يطلب منكم إلا تقديم الوثائق المتعلقة بنشاطكم المهني الحالي، بما في ذلك عقد العمل، والأعمال المنشورة حديثًا، والبيانات المتعلقة بالمؤسسة الصحفية، إضافة إلى صورة شمسية حديثة.\n\n\
عند انقضاء هذا الأجل، تفقد بطاقتكم صلاحيتها. ويظل التجديد ممكنًا لمدة سنة، غير أن البطاقة تظل غير سارية خلال هذه الفترة، وتظهر بوصفها منتهية الصلاحية عند أي عملية تحقق. وبعد انقضاء سنة، يتعين تقديم ملف ترشح جديد وكامل.

CARD_RENEWED.subject=تجديد بطاقتكم الصحفية
CARD_RENEWED.action=الاطلاع على ملفي
CARD_RENEWED.body=السلام عليكم {fullName}،\n\n\
تم تجديد بطاقتكم الصحفية من طرف الوزارة.\n\n\
رقم البطاقة الجديد: {cardNumber}\nصالحة إلى غاية: {expiresAt}\n\n\
لم تعد بطاقتكم السابقة رقم {previousCardNumber} صالحة، وستظهر بوصفها مسحوبة عند أي عملية تحقق. ويمكنكم إتلافها أو إعادتها إلى الوزارة متى شئتم، دون أن يترتب عليكم أي إجراء إضافي بهذا الخصوص.\n\n\
تتضمن بطاقتكم الجديدة رمز تحقق يتيح لأي شخص التحقق من صلاحيتها لدى الوزارة.\n\n\
وسيتم إبلاغكم قريبًا بإجراءات استلام بطاقتكم الجديدة.

INSTITUTIONAL_RENEWAL_DUE.subject=اقتراب انتهاء صلاحية بطاقاتكم الصحفية
INSTITUTIONAL_RENEWAL_DUE.body=\
لديكم بطاقات صحفية يبلغ عددها {cardCount}، صادرة لصالح صحفيي مؤسستكم، وقد اقترب موعد انتهاء صلاحيتها، على أن تنتهي صلاحية أول بطاقة بتاريخ {earliestExpiry}.\n\n\
لتجديد هذه البطاقات، يرجى إعادة إيداع السجل الخاص بكم من خلال فضائكم. ويشمل التجديد الصحفيين الذين يتم الإبقاء عليهم في السجل، أما الذين تتم إزالتهم منه فلا يشملهم التجديد. وتتولى الوزارة بعد ذلك إصدار البطاقات المعنية.\n\n\
كل بطاقة لا يتم تجديدها تفقد صلاحيتها عند حلول تاريخ انتهائها، وتظهر بوصفها منتهية الصلاحية عند أي عملية تحقق.
INSTITUTIONAL_RENEWAL_DUE.action=الدخول إلى فضائي

PRINT_DIGEST.subject={total} بطاقة جاهزة للإنتاج
PRINT_DIGEST.body=\
توجد حاليًا {total} بطاقة في انتظار الإنتاج:\n\n\
— بطاقات الدورات: {sessionCards}\n\
— بطاقات الشرف: {honourCards}\n\
— البطاقات المؤسسية: {institutionalCards}\n\n\
يمكن تنزيل العناصر اللازمة لإنتاج البطاقات — الصورة ورمز التحقق — من فضائكم.

INSTITUTION_REQUEST_CONFIRM.subject=تأكيد عنوان البريد الإلكتروني المرتبط بطلبكم
INSTITUTION_REQUEST_CONFIRM.body=\
السلام عليكم {contactName}،\n\n\
تم استلام طلب تسجيل {institutionName} بصفتها مؤسسة.\n\n\
يرجى تأكيد عنوان البريد الإلكتروني هذا حتى يتسنى إحالة طلبكم إلى الوزارة. ولن تتم دراسة الطلب قبل استكمال هذا التأكيد.\n\n\
يظل هذا الرابط صالحًا لمدة {days} أيام.
INSTITUTION_REQUEST_CONFIRM.action=تأكيد عنواني

INSTITUTION_REQUEST_APPROVED.subject=الموافقة على تسجيل مؤسستكم
INSTITUTION_REQUEST_APPROVED.body=\
السلام عليكم {contactName}،\n\n\
وافقت الوزارة على طلب تسجيل {institutionName}.\n\n\
أصبح حسابكم مفعلًا، ويمكنكم تسجيل الدخول باستخدام عنوان البريد الإلكتروني وكلمة المرور اللذين تم اختيارهما عند تقديم الطلب، ثم تسجيل صحفيي مؤسستكم من خلال فضائكم.
INSTITUTION_REQUEST_APPROVED.action=تسجيل الدخول

INSTITUTION_REQUEST_REJECTED.subject=قرار بشأن طلب تسجيل مؤسستكم
INSTITUTION_REQUEST_REJECTED.body=\
السلام عليكم {contactName}،\n\n\
بعد دراسة الطلب، قررت الوزارة عدم الاستجابة لطلب تسجيل {institutionName}، وذلك للسبب التالي:\n\n\
{reason}\n\n\
ويمكنكم تقديم طلب جديد مرفقًا بالوثائق والعناصر المطلوبة.

# ═══ البطاقة المتداولة ═══

CARD_SUSPENDED.subject=تعليق بطاقتكم الصحفية
CARD_SUSPENDED.body=السلام عليكم {fullName}،\n\n\
تم تعليق العمل ببطاقتكم الصحفية رقم {cardNumber} اعتبارًا من اليوم، وستظهر بوصفها موقوفة عند أي عملية تحقق.\n\n\
مبرر التعليق:\n{reason}\n\n\
يُعد تعليق البطاقة إجراءً تحفظيًا قابلًا للرفع. وفي حال الاعتراض على هذا الإجراء، يرجى التوجه إلى الوزارة.

CARD_REVOKED.subject=سحب بطاقتكم الصحفية
CARD_REVOKED.body=السلام عليكم {fullName}،\n\n\
تم سحب بطاقتكم الصحفية رقم {cardNumber}. ولم تعد البطاقة صالحة، وستظهر بوصفها مسحوبة عند أي عملية تحقق.\n\n\
مبرر السحب:\n{reason}\n\n\
يترتب على هذا القرار إنهاء اعتمادكم. ويمكنكم تقديم ترشح جديد خلال دورة لاحقة.

CARD_REINSTATED.subject=إعادة سريان بطاقتكم الصحفية
CARD_REINSTATED.body=السلام عليكم {fullName}،\n\n\
أصبحت بطاقتكم الصحفية رقم {cardNumber} سارية من جديد.\n\n\
{reason}

# ═══ الإدارة ═══

REVOCATION_PROPOSED.subject=اقتراح سحب البطاقة رقم {proposalId}
REVOCATION_PROPOSED.action=دراسة الاقتراح
REVOCATION_PROPOSED.body=تقدم أحد أعضاء لجنة دراسة الملفات باقتراح لسحب بطاقة صحفية.\n\n\
البطاقة المعنية: {cardNumber}\nالمبرر المستند إليه: {groundCode}\n\n\
يظل سحب البطاقة مشروطًا بصدور قرار من الوزارة.
