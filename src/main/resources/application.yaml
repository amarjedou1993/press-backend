spring:
  application:
    name: press-accreditation

  messages:
    # ⚠️ DEUX paquets : celui des courriels, et tout autre que vous auriez.
    # Séparé de `messages` pour que le fichier des courriels reste lisible
    # par quelqu'un qui n'écrit pas de code.
    basename: messages/email
    encoding: UTF-8
    # Une clé manquante lève une exception plutôt que d'afficher son nom.
    # Sur un courriel officiel, "VERIFY_EMAIL.body" dans le corps serait pire
    # qu'un échec d'envoi — l'échec, au moins, se voit dans les journaux.
    use-code-as-default-message: false
    cache-duration: 1h

  profiles:
    active: dev   # overridden in prod via SPRING_PROFILES_ACTIVE=prod

  jpa:
    open-in-view: false          # IMPORTANT — see notes below
    hibernate:
      ddl-auto: validate         # Flyway owns the schema. Never 'update'.
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB        # must match app.storage.max-file-size-bytes
      max-request-size: 12MB     # one file per upload request + multipart overhead

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

  mail:
    default-encoding: UTF-8      # French accents in notification emails

server:
  port: 8080
  shutdown: graceful             # finish in-flight requests on deploy

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true            # /actuator/health/liveness + /readiness

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# ════════════════════════════════════════════════════
# Application configuration → binds to AppProperties
# (Khidmaty block removed — returns in V2 with the feature
#  and spring-boot-starter-oauth2-resource-server)
# ════════════════════════════════════════════════════
app:
  jwt:
    access-token-ttl: 24h

  storage:
    max-file-size-bytes: 10485760          # 10 MB — keep in sync with multipart above
    allowed-mime-types:
      - application/pdf
      - image/jpeg
      - image/png

  identity:
    nni-regex: "^\\d{10}$"
    phone-regex: "^(\\+222)?[234]\\d{7}$"      # NEW — confirm format with HAPA

  card:
#    validity: 365d                          # PLACEHOLDER — pending HAPA card design (week 6)
#    number-prefix: HAPA                     # PLACEHOLDER — numbering convention pending HAPA
    # FALLBACK ONLY, for sessions created before V13. A card's expiry comes
    # from its session (sessions.card_expiry_date), because accreditation runs
    # in cycles: everyone accredited together renews together.
    validity-days: 730         # ⚠️ CONFIRM — the samples suggest ~2 years
    number-series: A        # ⚠️ CONFIRM its meaning with HAPA
#    contact-line: "HAPA · Nouakchott · www.hapa.mr"

  application:
    number-prefix: APP
    max-correction-rounds: 1               # V1.3 §H — one correction round, hard limit

  session:
    # V1.3 §F: phases close by EXPLICIT admin action — there is no automatic
    # phase transition. This cron only drives the correction-deadline check:
    # applications still in CORRECTION_REQUESTED after correction_end are
    # auto-rejected with the unanswered correction request as justification (§G.5).
    correction-deadline-cron: "0 */5 * * * *"
    # Sessions are spaced so the commission is never examining two cohorts at
    # once, and so candidates are not confused about which session they are
    # applying to. Two months by default; HAPA can change it without a
    # deployment.
    minimum-gap-days: 60

  revalidation:
    enabled: false
    url: ""
    token: ""

  review:
    # A dossier held longer than this returns to the pool overnight. Seven
    # days covers illness or leave without letting a candidate's file sit
    # untouched while the session's review phase runs out. 0 disables it.
    claim-expiry-days: 7

  locale:
    default-language: FR
    supported-languages: [FR, AR]

  security:
    auth-requests-per-minute: 10
    password-regex: "^(?=.*[A-Za-z])(?=.*\\d).{8,100}$"
  cors:
    allowed-origins: []