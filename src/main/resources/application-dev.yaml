spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/presscard-db
    username: postgres
    password: 1234

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false                    # MailHog / Mailpit — web UI on http://localhost:8025

  messages:
    # Reload on every lookup: a wording change should show on the next send,
    # not an hour later. Production keeps the 1h from application.yaml.
    cache-duration: 0

server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param  # add ?trace=true to see stacktraces

logging:
  level:
    com.presscard: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE   # shows bound query parameters

app:
  jwt:
    issuer: press-accreditation.local
    private-key-location: classpath:keys/dev-private.pem
    public-key-location: classpath:keys/dev-public.pem

  storage:
    root-directory: ./storage/dev

  email:
    enabled: true                       # was false — turn it on for dev
    from: no-reply@press-accreditation.local
    commission-inbox: commission@press-accreditation.local

  admin:
    email: admin@press-accreditation.local
    initial-password: admin_dev_password

  security:
    auth-requests-per-minute: 100   # never trip yourself while developing
  cors:
    allowed-origins: [ "http://localhost:3000" ]

  revalidation:
    enabled: true
    url: http://localhost:3000/api/revalidate
    token: dev-revalidate-secret

  card:
    signing-private-key-location: classpath:keys/dev-card-private.pem
    signing-public-key-location: classpath:keys/dev-card-public.pem
    signing-key-id: dev-2026
    verification-base-url: http://localhost:3000/verifier