spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  jpa:
    show-sql: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  forward-headers-strategy: framework   # correct client IPs behind nginx/reverse proxy

springdoc:
  # No public API console on a government production system
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.presscard: INFO
    org.springframework.security: WARN

app:
  jwt:
    issuer: ${APP_JWT_ISSUER}
    private-key-location: file:${JWT_PRIVATE_KEY_PATH:/etc/press-accreditation/keys/private.pem}
    public-key-location: file:${JWT_PUBLIC_KEY_PATH:/etc/press-accreditation/keys/public.pem}

  storage:
    root-directory: ${STORAGE_ROOT:/var/lib/press-accreditation/storage}

  email:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:no-reply@hapa.mr}
    commission-inbox: ${COMMISSION_INBOX:commission@hapa.mr}

  security:
    auth-requests-per-minute: ${AUTH_RATE_LIMIT:10}
  cors:
    allowed-origins: [ "${FRONTEND_ORIGIN}" ]

  revalidation:
    enabled: ${REVALIDATE_ENABLED:true}
    url: ${REVALIDATE_URL}
    token: ${REVALIDATE_TOKEN}