spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  jpa:
    show-sql: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  forward-headers-strategy: framework   # correct client IPs behind the reverse proxy

springdoc:
  # No public API console on a government production system
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.presscard: INFO
    org.springframework.security: WARN

app:
  jwt:
    issuer: ${APP_JWT_ISSUER}
    private-key-location: file:${JWT_PRIVATE_KEY_PATH:/etc/press-accreditation/keys/private.pem}
    public-key-location: file:${JWT_PUBLIC_KEY_PATH:/etc/press-accreditation/keys/public.pem}

  storage:
    root-directory: ${STORAGE_ROOT:/var/lib/press-accreditation/storage}

  email:
    enabled: ${MAIL_ENABLED:true}
    # ⚠️ NO DEFAULT. The sender must be an address the SPF/DKIM records cover;
    # a guessed one would be accepted here and silently land in spam.
    from: ${MAIL_FROM}
    commission-inbox: ${COMMISSION_INBOX:commission@mcacrp.mr}

  security:
    auth-requests-per-minute: ${AUTH_RATE_LIMIT:10}

  cors:
    allowed-origins: [ "${FRONTEND_ORIGIN}" ]

  revalidation:
    enabled: ${REVALIDATE_ENABLED:true}
    url: ${REVALIDATE_URL}
    token: ${REVALIDATE_TOKEN}

  card:
    signing-private-key-location: file:${CARD_KEY_PATH:/etc/press-accreditation/keys/card-private.pem}
    signing-public-key-location: file:${CARD_PUB_PATH:/etc/press-accreditation/keys/card-public.pem}
    signing-key-id: ${CARD_KEY_ID:MCACRP-2026}
    # ⚠️ NO DEFAULT, AND THAT IS DELIBERATE.
    # This address is printed in every card's QR code and can never change
    # after the first print. A default would let the app start with a guessed
    # domain and print cards nobody can verify. Without CARD_VERIFICATION_URL
    # the app refuses to start, which is the right failure.
    verification-base-url: ${CARD_VERIFICATION_URL}

  # ⚠️ The very first SUPER_ADMIN account. Change its password at first login,
  # then remove ADMIN_INITIAL_PASSWORD from the environment. The empty
  # defaults (":") are what make that removal safe: without them, a missing
  # variable stops the application from starting.
  admin:
    email: ${ADMIN_EMAIL:}
    initial-password: ${ADMIN_INITIAL_PASSWORD:}